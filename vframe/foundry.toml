# Standalone stock-Foundry project. Does not load the native @future profile.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
auto_detect_remappings = false
remappings = ["forge-std/=dependencies/forge-std-1.16.2/src/"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
cbor_metadata = false
bytecode_hash = "none"
create2_deployer = "0x4e59b44847b379578588920cA78FbF26c0B4956C"
# The deployment script writes predicted addresses to web/.env.local before broadcasting.
fs_permissions = [{ access = "read-write", path = "../web" }]

[fmt]
line_length = 100
tab_width = 4

[soldeer]
remappings_generate = false

[dependencies]
forge-std = "1.16.2"
