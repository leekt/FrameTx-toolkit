# The default profile compiles everything -- policy, frame glue, accounts and
# EIP helpers -- natively with the patched solc at the experimental `@future`
# EVM version. It requires the toolkit's patched forge (stock Foundry has no
# `@future` in its EvmVersion enum) and the patched solc built at
# ../solidity/build/solc/solc.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
auto_detect_remappings = false
remappings = [
    "forge-std/=dependencies/forge-std-1.16.2/src/",
    "kernel-v3.3/=dependencies/kernel-v3.3-3.3.0/src/",
    "solady/=dependencies/solady-0.0.278/src/",
    "ExcessivelySafeCall/=dependencies/excessively-safe-call-0.0.1/src/",
]
solc = "../solidity/build/solc/solc"
evm_version = "@future"
# `@future` is experimental; solc requires the experimental setting with it.
experimental = true
optimizer = true
optimizer_runs = 200
# Metadata-free bytecode, as the docs' byte-count claims assume: no CBOR
# trailer, no source-hash identity in the runtime.
cbor_metadata = false
bytecode_hash = "none"
# The remaining standalone Yul file is an operand-order compiler probe, not a contract target.
skip = ["*.yul"]

# Solar (forge's native Solidity frontend) has no knowledge of the fork's
# frame builtins and reports them as unresolved symbols; the patched solc is
# the only frontend that understands this dialect.
[lint]
lint_on_build = false

# Stock-Foundry escape hatch: `FOUNDRY_PROFILE=policy forge test --match-path
# "test/FrameAccountPolicy.t.sol"` runs the policy layer with stock solc and
# stock forge; the frame glue is out of scope here.
[profile.policy]
src = "src/policy"
solc = "0.8.30"
evm_version = "prague"
experimental = false

[fmt]
line_length = 100
tab_width = 4

# Soldeer owns every Solidity dependency. Remappings stay explicit because
# Kernel v3.3 imports Solady and ExcessivelySafeCall from their `src` roots,
# while Soldeer's generated remappings point at package roots.
[soldeer]
remappings_generate = false
recursive_deps = false

[dependencies]
forge-std = "1.16.2"
solady = { version = "0.0.278", git = "https://github.com/vectorized/solady.git", rev = "3f2f5345261904463f5429c9031c3d2185c0f4fe" }
"kernel-v3.3" = { version = "3.3.0", git = "https://github.com/zerodevapp/kernel.git", rev = "cd697c7e21715d015e0643af22310a99aa17433b" }
excessively-safe-call = { version = "0.0.1", git = "https://github.com/nomad-xyz/ExcessivelySafeCall.git", rev = "81cd99ce3e69117d665d7601c330ea03b97acce0" }
