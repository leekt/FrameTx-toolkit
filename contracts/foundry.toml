# The policy layer compiles and tests with stock solc: it contains no EIP-8141
# opcodes, so Foundry's EVM can execute it. The frame glue that does use the new
# opcodes lives in src/accounts and src/frame and is built by
# script/build-frame-accounts.sh because Foundry cannot compile it (evm_version
# "@future" is not in its enum). The toolkit's patched revm executes the
# resulting artifacts during forge tests.
[profile.default]
# Only the policy layer is compiled by forge. The accounts in src/accounts use
# the frame opcodes, which forge cannot compile; build-frame-accounts.sh handles
# them with the patched solc and tests load the artifacts with vm.etch.
src = "src/policy"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200

# Frame-glue accounts are compiled outside Foundry by
# script/build-frame-accounts.sh; tests read their runtime bytecode from here.
fs_permissions = [{ access = "read", path = "./out-frame" }]

[fmt]
line_length = 100
tab_width = 4
